services:
  mongodb:
    image: mongo:7
    container_name: security-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-security_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-security_pass}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-securitydb}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
    container_name: parse-server-app
    restart: unless-stopped
    init: true
    ports:
      - "1337:1337"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      SERVER_PORT: 1337
      DATABASE_URI: "mongodb://${MONGO_USERNAME:-security_user}:${MONGO_PASSWORD:-security_pass}@mongodb:27017/${MONGO_DB:-securitydb}?authSource=admin"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:1337/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  mongodb_data:

networks:
  default:
    # ตรึง subnet ไว้ให้ gateway เป็น 172.20.0.1 เสมอ ตรงกับค่า MASTER_KEY_IPS ใน .env
    # ถ้าเครื่องมี network อื่นใช้ subnet นี้อยู่แล้ว ให้เปลี่ยนเป็นช่วงอื่นที่ว่าง
    # แล้วแก้ MASTER_KEY_IPS ใน .env ให้ตรงกับ gateway ของ subnet ใหม่
    ipam:
      config:
        - subnet: 172.20.0.0/24
